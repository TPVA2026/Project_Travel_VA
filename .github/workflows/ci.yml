name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a Google API key pattern is committed
        run: |
          if grep -rEn "AIza[0-9A-Za-z_-]{30,}" . --exclude-dir=node_modules --exclude-dir=.git; then
            echo "Possible API key found"; exit 1
          fi
